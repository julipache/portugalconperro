name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Verify SEO output
        run: |
          test -s dist/sitemap.xml
          grep -q '<urlset' dist/sitemap.xml
          grep -q 'https://portugalconperro.com/' dist/sitemap.xml
          grep -q 'https://portugalconperro.com/destinos/' dist/sitemap.xml
          grep -q 'https://portugalconperro.com/sobre-nosotros/' dist/sitemap.xml
          grep -q 'https://portugalconperro.com/metodologia/' dist/sitemap.xml
          grep -q 'https://portugalconperro.com/afiliacion/' dist/sitemap.xml
          grep -q 'https://portugalconperro.com/privacidad-cookies/' dist/sitemap.xml
          test -s dist/robots.txt
          grep -q 'Sitemap: https://portugalconperro.com/sitemap.xml' dist/robots.txt
          test -s dist/destinos/index.html
          test -s dist/sobre-nosotros/index.html
          test -s dist/metodologia/index.html
          test -s dist/afiliacion/index.html
          test -s dist/privacidad-cookies/index.html
          grep -q 'BreadcrumbList' dist/destinos/lagos/index.html
          grep -q 'Migas de pan' dist/destinos/lagos/index.html
          grep -q '/destinos/sagres/' dist/destinos/lagos/index.html
          grep -q '/destinos/portimao/' dist/destinos/lagos/index.html
      - name: Verify Booking affiliate output
        run: |
          test -s dist/alojamientos/index.html
          grep -q '101879858-11891543' dist/alojamientos/index.html
          grep -q 'portugalconperro-alojamientos-' dist/alojamientos/index.html
          grep -q 'rel="sponsored nofollow noopener"' dist/alojamientos/index.html
          grep -q '101879858-11891543' dist/destinos/lagos/index.html
          grep -q 'portugalconperro-guide-lagos-hero-lagos-portugal' dist/destinos/lagos/index.html
          grep -q 'portugalconperro-guide-lagos-sidebar-lagos-portugal' dist/destinos/lagos/index.html
          grep -q 'portugalconperro-guide-lagos-bottom-lagos-portugal' dist/destinos/lagos/index.html
          grep -q 'data-booking-placement="destination-hero"' dist/destinos/lagos/index.html
          grep -q 'data-booking-placement="destination-sidebar"' dist/destinos/lagos/index.html
          grep -q 'data-booking-placement="destination-bottom"' dist/destinos/lagos/index.html
