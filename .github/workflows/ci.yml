name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Verify SEO output
        run: |
          test -s dist/sitemap.xml
          grep -q '<urlset' dist/sitemap.xml
          grep -q 'https://portugalconperro.com/' dist/sitemap.xml
          test -s dist/robots.txt
          grep -q 'Sitemap: https://portugalconperro.com/sitemap.xml' dist/robots.txt
